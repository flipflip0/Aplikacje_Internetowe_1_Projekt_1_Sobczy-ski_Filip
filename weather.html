<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prognoza Pogody</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">
        <h1>Prognoza Pogody 🌤️</h1>
        
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Wpisz miasto (np. Szczecin)">
            <button id="weather-button">Pogoda</button>
        </div>

        <section id="current-weather">
            <h2>Aktualna Pogoda</h2>
            <div id="current-results"></div>
        </section>

        <section id="forecast-weather">
            <h2>Prognoza 5-dniowa</h2>
            <div id="forecast-results" class="forecast-grid"></div>
        </section>

        <p class="api-note">OpenWeatherMap</p>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
